name: Deploy Quartz site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Run every 4 hours
  # schedule:
  #   - cron: 0 */4 * * *

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build Site
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout Obsidian Files
        uses: actions/checkout@v4
        with:
          path: contents

      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4.5.1
          path: quartz

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Quartz Node.js dependencies
        run: npm ci
        working-directory: ./quartz

      - name: Copy custom Quartz config
        run: cp -Rf ./contents/.quartz-overrides/* ./quartz/

      - name: Build site contents
        run: "npx quartz build --directory=../contents"
        working-directory: ./quartz

      # - name: Copy redirect index.html
      #   run: "cp ./quartz-data/index.html ./quartz/public/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./quartz/public

  # Deploy to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
